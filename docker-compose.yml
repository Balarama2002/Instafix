services:
  instafix-web:
    build: .
    container_name: instafix_app
    restart: always
    expose:
      - "80"
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.instafix.entrypoints=web,websecure"
      - "traefik.http.middlewares.instafix-auth.basicauth.users=Techygeekhub.com:{SHA}IMOVPqCAB9QpZ57/vseH5G3cxcg="
      - "traefik.http.routers.instafix.middlewares=n8n@docker,instafix-auth"
      - "traefik.http.routers.instafix.rule=Host(`instafix.srv1901759.hstgr.cloud`)"
      - "traefik.http.routers.instafix.tls=true"
      - "traefik.http.routers.instafix.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.instafix.service=instafix"
      - "traefik.http.services.instafix.loadbalancer.server.port=80"

networks:
  n8n_default:
    external: true
